name: Construire DESPORTE Android signé

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Préparer le projet
        run: chmod +x gradlew scripts/ci/run_contract_tests.sh

      - name: Nettoyer les fichiers v190 déposés par erreur à la racine
        shell: bash
        run: rm -f ActivityDetailActivity.java FitDestinationStore.java HeartRateRecoveryService.java validate_current.py

      - name: Valider EQUIP006 CSV et les contrats fonctionnels
        shell: bash
        run: scripts/ci/run_contract_tests.sh

      - name: Reconstituer la clé de signature permanente
        shell: bash
        env:
          DESPORTE_KEYSTORE_BASE64: ${{ secrets.DESPORTE_KEYSTORE_BASE64 }}
          DESPORTE_KEYSTORE_PASSWORD: ${{ secrets.DESPORTE_KEYSTORE_PASSWORD }}
          DESPORTE_KEY_ALIAS: ${{ secrets.DESPORTE_KEY_ALIAS }}
        run: |
          if [ -z "$DESPORTE_KEYSTORE_BASE64" ]; then
            echo "Le secret DESPORTE_KEYSTORE_BASE64 est absent."
            exit 1
          fi
          printf '%s' "$DESPORTE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/desporte-release.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/desporte-release.jks" \
            -storepass "$DESPORTE_KEYSTORE_PASSWORD" \
            -alias "$DESPORTE_KEY_ALIAS" >/dev/null
          echo "Empreinte SHA-1 à déclarer dans le client OAuth Android Google :"
          keytool -list -v \
            -keystore "$RUNNER_TEMP/desporte-release.jks" \
            -storepass "$DESPORTE_KEYSTORE_PASSWORD" \
            -alias "$DESPORTE_KEY_ALIAS" | grep -E "SHA1:|SHA-1:" | head -1 || true

      - name: Compiler l'APK signé
        env:
          DESPORTE_KEYSTORE_PATH: ${{ runner.temp }}/desporte-release.jks
          DESPORTE_KEYSTORE_PASSWORD: ${{ secrets.DESPORTE_KEYSTORE_PASSWORD }}
          DESPORTE_KEY_ALIAS: ${{ secrets.DESPORTE_KEY_ALIAS }}
          DESPORTE_KEY_PASSWORD: ${{ secrets.DESPORTE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Vérifier la signature de l'APK
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Publier l'APK EQUIP006 CSV matériel
        uses: actions/upload-artifact@v4
        with:
          name: DESPORTE-v194-ACTIVITY014-EQUIP005-EQUIP006-CSV
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 3
