name: Construire CultureGenerale Android signé

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rendre Gradle exécutable
        run: chmod +x gradlew

      - name: Reconstruire la clé de signature permanente
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/culture-generale-release.jks"
          test -s "$RUNNER_TEMP/culture-generale-release.jks"

      - name: Compiler l'APK debug
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Signer l'APK avec SIGN001
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "APK debug introuvable"
            exit 1
          fi

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner introuvable"
            exit 1
          fi

          OUT="$RUNNER_TEMP/CultureGenerale-release-signed.apk"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/culture-generale-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$OUT" \
            "$APK"

          cp "$OUT" CultureGenerale-release-signed.apk

      - name: Vérifier la signature de l'APK
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs CultureGenerale-release-signed.apk

      - name: Publier l'APK signé
        uses: actions/upload-artifact@v4
        with:
          name: CultureGenerale-Android-signed
          path: CultureGenerale-release-signed.apk
          if-no-files-found: error
