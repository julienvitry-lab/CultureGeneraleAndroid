name: Installer CGWEB035 FIX2 LEARNING_HUB002

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  install:
    name: Installer NO_DATA_DIFFICULTY001
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer CGWEB035 FIX2
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO="$GITHUB_WORKSPACE"
          PUB="$REPO/web/public"
          FUN="$REPO/web/functions"
          INDEX="$PUB/index.html"
          BACK="$FUN/cgweb035.js"
          FRONT="$PUB/cgweb035.js"
          CSS="$PUB/cgweb035.css"
          SEARCH="$FUN/cgweb032.js"
          README="$REPO/README_CGWEB035_LEARNING_HUB002.txt"

          cd "$REPO"

          echo "============================================================"
          echo " CGWEB035 FIX2 · LEARNING_HUB002"
          echo " NO_DATA_DIFFICULTY001"
          echo "============================================================"
          echo

          test -f "$BACK" || { echo "❌ cgweb035.js backend absent"; exit 20; }
          test -f "$FRONT" || { echo "❌ cgweb035.js frontend absent"; exit 21; }
          test -f "$CSS" || { echo "❌ cgweb035.css absent"; exit 22; }
          test -f "$SEARCH" || { echo "❌ cgweb032.js absent"; exit 23; }
          test -f "$INDEX" || { echo "❌ index.html absent"; exit 24; }

          grep -Fq "handleLearningHub" "$SEARCH" || {
            echo "❌ Routage CGWEB035 via cgweb032Search absent."
            exit 25
          }

          echo "✅ Baseline LEARNING_HUB001 reconnue."

          python - "$BACK" "$FRONT" "$CSS" <<'PY'
          from pathlib import Path
          import base64, sys

          vals = ["", "", ""]

          for path, payload in zip(sys.argv[1:], vals):
              Path(path).write_text(
                  base64.b64decode(payload).decode("utf-8"),
                  encoding="utf-8"
              )

          print("✅ Backend, frontend et CSS FIX2 écrits.")
          PY

          python - "$INDEX" <<'PY'
          from pathlib import Path
          import re, sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          s = re.sub(
              r'(\./cgweb035\.css\?v=)[^"]+',
              r'\1CGWEB035_FIX2_LEARNING_HUB002',
              s,
              count=1
          )

          s = re.sub(
              r'(\./cgweb035\.js\?v=)[^"]+',
              r'\1CGWEB035_FIX2_LEARNING_HUB002',
              s,
              count=1
          )

          if 'cgweb035.js?v=CGWEB035_FIX2_LEARNING_HUB002' not in s:
              raise SystemExit("❌ cache-bust JS CGWEB035 introuvable")

          if 'cgweb035.css?v=CGWEB035_FIX2_LEARNING_HUB002' not in s:
              raise SystemExit("❌ cache-bust CSS CGWEB035 introuvable")

          p.write_text(s, encoding="utf-8")
          print("✅ Cache-bust LEARNING_HUB002 appliqué.")
          PY

          cat > "$README" <<'EOF'
          CGWEB035 FIX2 · LEARNING_HUB002
          ================================

          NO_DATA_DIFFICULTY001
          - une question avec 0 réponse évaluée n'a plus de score de difficulté ;
          - difficulté = null côté backend ;
          - affichage Web = « Difficulté — · données insuffisantes » ;
          - ces questions sont exclues de la difficulté moyenne du thème/domaine/global ;
          - le classement Difficulté place les éléments sans données après les éléments évalués.

          UX
          - pluriels principaux corrigés ;
          - « 0 % réussite » n'est plus affiché lorsqu'il n'existe aucune réponse évaluée ;
          - navigation principale légèrement compactée pour éviter le collage des libellés.

          Architecture
          - aucun accès SQLite ;
          - aucune écriture Firestore ;
          - aucune modification de workflow GitHub par le job ;
          - routage CGWEB035 via cgweb032Search conservé.
          EOF

          echo
          echo "=== Contrôles syntaxe ==="
          node --check "$BACK"
          node --check "$FRONT"
          node --check "$SEARCH"

          echo
          echo "=== Contrôles NO_DATA_DIFFICULTY001 ==="
          grep -Fq "if(q.attempts<=0)" "$BACK"
          grep -Fq "q.difficulty=null" "$BACK"
          grep -Fq "difficulty:diffWeight?Math.round(diffWeighted/diffWeight):null" "$BACK"
          grep -Fq "averageDifficulty:diffCount?Math.round(diffSum/diffCount):null" "$BACK"
          grep -Fq "Difficulté — · données insuffisantes" "$FRONT"
          grep -Fq "aucune réponse évaluée" "$FRONT"
          grep -Fq "CGWEB035 FIX2 · LEARNING_HUB002" "$FRONT"
          grep -Fq "CGWEB035 FIX2 · LEARNING_HUB002" "$CSS"

          if grep -Eq '\.(set|update|delete)\(' "$BACK"; then
            echo "❌ Écriture Firestore détectée dans CGWEB035."
            exit 30
          fi

          if ! git diff --quiet -- .github/workflows; then
            echo "❌ Un workflow GitHub a été modifié : arrêt."
            git diff -- .github/workflows
            exit 31
          fi

          git diff --check

          echo "✅ NO_DATA_DIFFICULTY001 validé."
          echo "✅ Aucun workflow modifié."
          echo
          git --no-pager diff --stat

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$BACK" "$FRONT" "$CSS" "$INDEX" "$README"

          if git diff --cached --quiet; then
            echo "ℹ️ CGWEB035 FIX2 déjà appliqué."
          else
            git commit -m "CGWEB035 FIX2 LEARNING_HUB002 no-data difficulty"
            git push origin HEAD:main
          fi

          echo
          echo "============================================================"
          echo "✅ CGWEB035 FIX2 · LEARNING_HUB002 POUSSÉ SUR MAIN"
          echo "============================================================"

          echo
          echo "=== Tentative de lancement automatique du déploiement Web ==="
          PAYLOAD='{"ref":"main"}'
          if curl -fsS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/CGIMPORT002_WEB_DEPLOY.yml/dispatches" \
            -d "$PAYLOAD"
          then
            echo "✅ Déploiement Culture Générale Web lancé automatiquement."
          else
            echo "⚠️ Déclenchement automatique non autorisé."
            echo "   Lance manuellement : Actions > Déployer Culture Générale Web > Run workflow."
          fi

