name: Installer CGWEB035 FIX1 GitHub Safe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    name: Installer LEARNING_HUB001 sans modifier les workflows
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer CGWEB035 FIX1
        shell: bash
        run: |
          set -euo pipefail

          REPO="$GITHUB_WORKSPACE"
          PUB="$REPO/web/public"
          FUN="$REPO/web/functions"
          NAV="$PUB/cgweb016fix2.js"
          INDEX="$PUB/index.html"
          SEARCH="$FUN/cgweb032.js"
          HELPER="$FUN/cgweb035.js"
          FRONT="$PUB/cgweb035.js"
          CSS="$PUB/cgweb035.css"
          README="$REPO/README_CGWEB035_LEARNING_HUB001.txt"
          PATCH="$RUNNER_TEMP/cgweb035_fix1_patch.py"

          cd "$REPO"

          echo "============================================================"
          echo " CGWEB035 FIX1 · LEARNING_HUB001 · GITHUB SAFE"
          echo "============================================================"
          echo "Aucun fichier .github/workflows n'est modifié par ce job."
          echo "CGWEB035 passe par la fonction déjà déployée cgweb032Search."
          echo

          test -f "$SEARCH"
          test -f "$NAV"
          test -f "$INDEX"
          grep -Fq "exports.cgweb032Search" "$SEARCH"
          grep -Fq 'data-cg16-page="home2"' "$NAV"

          echo "✅ Baseline CGWEB032 / navigation reconnue."

          python - "$HELPER" "$FRONT" "$CSS" <<'PY'
          from pathlib import Path
          import base64,sys
          vals=["","",""]
          for path,b64 in zip(sys.argv[1:],vals):
              Path(path).write_text(base64.b64decode(b64).decode("utf-8"),encoding="utf-8")
          print("✅ CGWEB035 helper + frontend + CSS créés")
          PY

          python - "$PATCH" <<'PY'
          from pathlib import Path
          import base64,sys
          Path(sys.argv[1]).write_text(base64.b64decode("").decode("utf-8"),encoding="utf-8")
          PY

          python "$PATCH" "$SEARCH" "$NAV" "$INDEX"
          rm -f "$PATCH"

          cat > "$README" <<'EOF'
          CGWEB035 · LEARNING_HUB001 · FIX1 GITHUB SAFE

          Architecture :
          - aucun workflow GitHub n'est modifié par GitHub Actions ;
          - le frontend CGWEB035 appelle cgweb032Search, déjà présent dans le pipeline ;
          - cgweb032Search délègue les requêtes cgweb035=true au helper web/functions/cgweb035.js ;
          - le push déclenche le workflow Web existant, qui redéploie cgweb032Search et Firebase Hosting.

          Fonctions transférées sur Web :
          - Historique
          - Maîtrise
          - Jamais vues
          - À réviser
          - Points faibles
          - Temps de réponse
          - Difficulté
          EOF

          echo
          echo "=== Contrôles ==="
          node --check "$HELPER"
          node --check "$FRONT"
          node --check "$SEARCH"
          node --check "$NAV"
          grep -Fq "handleLearningHub" "$SEARCH"
          grep -Fq "cgweb035:true" "$FRONT"
          grep -Fq 'data-cg16-page="learning"' "$NAV"
          grep -Fq 'cgweb035.js?v=CGWEB035_LEARNING_HUB001' "$INDEX"

          if ! git diff --quiet -- .github/workflows; then
            echo "❌ Un workflow GitHub a été modifié : arrêt."
            git diff -- .github/workflows
            exit 31
          fi

          git diff --check

          echo "✅ Aucun workflow modifié."
          echo "✅ CGWEB035 routé via cgweb032Search."
          echo
          git --no-pager diff --stat

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$HELPER" "$FRONT" "$CSS" "$SEARCH" "$NAV" "$INDEX" "$README"

          if git diff --cached --quiet; then
            echo "ℹ️ CGWEB035 FIX1 déjà appliqué."
          else
            git commit -m "CGWEB035 FIX1 route learning hub through cgweb032"
            git push origin HEAD:main
          fi

          echo
          echo "============================================================"
          echo "✅ CGWEB035 FIX1 POUSSÉ SUR MAIN"
          echo "============================================================"
          echo "Le workflow Web habituel doit maintenant se lancer automatiquement."
          echo "Il redéploiera cgweb032Search + Hosting sans permission workflow spéciale."

