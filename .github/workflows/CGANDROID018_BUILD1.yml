name: CGANDROID018 BUILD1 - Telephone + Tablette

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "tablet/**"
      - "settings.gradle"
      - "build.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/CGANDROID018_BUILD1.yml"

permissions:
  contents: read

jobs:

  phone:
    name: PHONE_APK_BUILD001
    runs-on: ubuntu-latest

    steps:

      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparer Gradle
        run: chmod +x gradlew

      - name: Verifier le module telephone
        run: |
          set -euo pipefail

          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/google-services.json

          grep -Fq \
            "applicationId 'fr.culturegenerale.android'" \
            app/build.gradle

          grep -Fq \
            "versionCode 963" \
            app/build.gradle

          grep -Fq \
            "versionName '9.6.3-cgandroid018'" \
            app/build.gradle

          grep -Fq \
            'question_origin' \
            app/src/main/java/fr/culturegenerale/android/MainActivity.java

          grep -Fq \
            'CUSTOM_QUESTION_LAYOUT001 / VERTICAL_CENTER001' \
            app/src/main/java/fr/culturegenerale/android/MainActivity.java

          echo "✓ module : app"
          echo "✓ package : fr.culturegenerale.android"
          echo "✓ CGANDROID018 présent"

      - name: COMPILE_VERIFY001 telephone
        run: |
          set -euo pipefail

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --stacktrace \
            --no-daemon

          echo "✓ compilation Java téléphone"

      - name: Reconstruire la cle permanente SIGN001
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "❌ secret ANDROID_KEYSTORE_BASE64 absent."
            echo "La clé permanente du téléphone est requise."
            exit 30
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/culture-generale-release.jks"

          test -s \
            "$RUNNER_TEMP/culture-generale-release.jks"

          echo "✓ clé SIGN001 reconstruite"

      - name: PHONE_APK_BUILD001
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/culture-generale-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "${ANDROID_KEYSTORE_PASSWORD:-}"
          test -n "${ANDROID_KEY_ALIAS:-}"
          test -n "${ANDROID_KEY_PASSWORD:-}"

          ./gradlew \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          cp \
            "$APK" \
            CultureGenerale-Telephone-CGANDROID018.apk

          echo "✓ APK téléphone produit"
          ls -lh CultureGenerale-Telephone-CGANDROID018.apk

      - name: Verifier signature telephone
        run: |
          set -euo pipefail

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -name apksigner \
              -type f \
              | sort -V \
              | tail -n 1
          )"

          test -n "$APKSIGNER"

          "$APKSIGNER" \
            verify \
            --verbose \
            --print-certs \
            CultureGenerale-Telephone-CGANDROID018.apk \
            | tee phone-signature.txt

          sha256sum \
            CultureGenerale-Telephone-CGANDROID018.apk \
            | tee phone-sha256.txt

          {
            echo "CGANDROID018 BUILD1"
            echo "device=telephone"
            echo "applicationId=fr.culturegenerale.android"
            echo "versionCode=963"
            echo "versionName=9.6.3-cgandroid018"
            echo "commit=$GITHUB_SHA"
            echo "signing=SIGN001 permanent"
          } > phone-build-info.txt

          echo "✓ signature téléphone vérifiée"

      - name: Publier APK telephone
        uses: actions/upload-artifact@v4
        with:
          name: CultureGenerale-Telephone-CGANDROID018-BUILD1
          path: |
            CultureGenerale-Telephone-CGANDROID018.apk
            phone-sha256.txt
            phone-signature.txt
            phone-build-info.txt
          if-no-files-found: error
          retention-days: 14


  tablet:
    name: TABLET_APK_BUILD001
    runs-on: ubuntu-latest

    steps:

      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Conserver la cle debug tablette
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cgandroid-tablet-debug-keystore-v1

      - name: Preparer Gradle
        run: chmod +x gradlew

      - name: Verifier le module tablette
        run: |
          set -euo pipefail

          test -f tablet/build.gradle
          test -f tablet/src/main/AndroidManifest.xml

          grep -Fq \
            "applicationId 'fr.culturegenerale.android.tablet'" \
            tablet/build.gradle

          grep -Fq \
            "versionCode 18" \
            tablet/build.gradle

          grep -Fq \
            "versionName 'CGANDROID018'" \
            tablet/build.gradle

          grep -Fq \
            "'CG_CHANNEL', '\"CGANDROID018\"'" \
            tablet/build.gradle

          grep -Fq \
            'question_origin' \
            tablet/src/main/java/fr/culturegenerale/android/tablet/TabletMainActivity.java

          grep -Fq \
            'CUSTOM_QUESTION_LAYOUT001 / VERTICAL_CENTER001' \
            tablet/src/main/java/fr/culturegenerale/android/tablet/TabletMainActivity.java

          echo "✓ module : tablet"
          echo "✓ package : fr.culturegenerale.android.tablet"
          echo "✓ CGANDROID018 présent"

      - name: COMPILE_VERIFY001 tablette
        run: |
          set -euo pipefail

          ./gradlew \
            :tablet:compileDebugJavaWithJavac \
            --stacktrace \
            --no-daemon

          echo "✓ compilation Java tablette"

      - name: TABLET_APK_BUILD001
        run: |
          set -euo pipefail

          ./gradlew \
            :tablet:assembleDebug \
            --stacktrace \
            --no-daemon

          APK="tablet/build/outputs/apk/debug/tablet-debug.apk"

          test -s "$APK"

          cp \
            "$APK" \
            CultureGenerale-Tablette-CGANDROID018.apk

          echo "✓ APK tablette produit"
          ls -lh CultureGenerale-Tablette-CGANDROID018.apk

      - name: Verifier signature tablette
        run: |
          set -euo pipefail

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -name apksigner \
              -type f \
              | sort -V \
              | tail -n 1
          )"

          test -n "$APKSIGNER"

          "$APKSIGNER" \
            verify \
            --verbose \
            --print-certs \
            CultureGenerale-Tablette-CGANDROID018.apk \
            | tee tablet-signature.txt

          sha256sum \
            CultureGenerale-Tablette-CGANDROID018.apk \
            | tee tablet-sha256.txt

          {
            echo "CGANDROID018 BUILD1"
            echo "device=tablette"
            echo "applicationId=fr.culturegenerale.android.tablet"
            echo "versionCode=18"
            echo "versionName=CGANDROID018"
            echo "commit=$GITHUB_SHA"
            echo "signing=persistent tablet debug key"
          } > tablet-build-info.txt

          echo "✓ signature tablette vérifiée"

      - name: Publier APK tablette
        uses: actions/upload-artifact@v4
        with:
          name: CultureGenerale-Tablette-CGANDROID018-BUILD1
          path: |
            CultureGenerale-Tablette-CGANDROID018.apk
            tablet-sha256.txt
            tablet-signature.txt
            tablet-build-info.txt
          if-no-files-found: error
          retention-days: 14
