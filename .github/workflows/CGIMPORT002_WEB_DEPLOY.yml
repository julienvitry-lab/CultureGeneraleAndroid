          grep -Fq 'cgweb022.js?v=CGWEB022_1' web/public/index.html
          grep -Fq 'cgweb024.js?v=CGWEB024_1' web/public/index.html
          grep -Fq 'cgweb025.js?v=CGWEB025_1' web/public/index.html
          grep -Fq 'cgweb026.js?v=CGWEB026_1' web/public/index.html
          grep -Fq 'cgweb027.js?v=CGWEB027_1' web/public/index.html
          grep -Fq 'cgweb028.js?v=CGWEB028_1' web/public/index.html
          grep -Fq 'cgweb029.js?v=CGWEB029_1' web/public/index.html
          grep -Fq 'cgweb030.js?v=CGWEB030_1' web/public/index.html
          grep -Fq 'cgweb031.js?v=CGWEB031_1' web/public/index.html
          grep -Fq 'cgweb032.js?v=CGWEB032_1' web/public/index.html
          grep -Fq 'cgweb033.js?v=CGWEB033_1' web/public/index.html
          grep -Fq 'cgweb034.js?v=CGWEB034_1' web/public/index.html
          grep -Fq 'question-images' web/storage.rules
          grep -Fq 'exports.cgimage005MigrateBatch' web/functions/index.js
          node --check web/public/cgimport002.js
          node --check web/public/cgimage001.js
          node --check web/public/cgimage005.js
          node --check web/public/cgimage006.js
          node --check web/public/cgimage007.js
          node --check web/public/cgimage008.js
          node --check web/functions/cgimage008.js
          node --check web/functions/cgimage007.js
          node --check web/functions/cgimage005.js
          node --check web/functions/cgweb018.js
          node --check web/public/cgimage002.js
          node --check web/public/cgweb017.js
          node --check web/public/cgweb018.js
          node --check web/public/cgweb019.js
