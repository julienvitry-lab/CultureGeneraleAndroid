name: Déployer Culture Générale Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/CGIMPORT002_WEB_DEPLOY.yml"

permissions:
  contents: read

concurrency:
  group: culturegeneralesync-web-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/functions/package.json

      - name: Vérifier les fichiers CGIMPORT002 Web
        shell: bash
        run: |
          set -euo pipefail
          test -f web/public/index.html
          test -f web/public/cgimport002.js
          test -f web/public/cgimport002.css
          test -f web/functions/index.js
          test -f web/functions/package.json
          test -f web/firebase.json
          test -f web/storage.rules
          test -f web/public/cgimage001.js
          test -f web/public/cgimage001.css
          test -f web/public/cgimage009.css
          test -f web/public/cgimage005.js
          test -f web/public/cgimage006.js
          test -f web/public/cgimage007.js
          test -f web/public/cgimage008.js
          test -f web/functions/cgimage008.js
          test -f web/functions/cgimage007.js
          test -f web/functions/cgimage005.js
          test -f web/functions/cgweb018.js
          test -f web/public/cgimage002.js
          test -f web/public/cgimage002.css
          test -f web/public/cgweb017.js
          test -f web/public/cgweb017.css
          test -f web/public/cgweb018.js
          test -f web/public/cgweb018.css
          test -f web/public/cgweb019.js
          test -f web/public/cgweb019.css
          test -f web/public/cgweb020.js
          test -f web/public/cgweb020.css
          test -f web/functions/cgweb020.js
          test -f web/public/cgweb021.js
          test -f web/public/cgweb021.css
          test -f web/functions/cgweb021.js
          test -f web/public/cgweb023.js
          test -f web/public/cgweb023.css
          test -f web/public/cgweb022.js
          test -f web/public/cgweb022.css
          test -f web/functions/cgweb022.js
          test -f web/public/cgweb024.js
          test -f web/public/cgweb024.css
          test -f web/functions/cgweb024.js
          test -f web/public/cgweb025.js
          test -f web/public/cgweb025.css
          test -f web/public/cgweb026.js
          test -f web/public/cgweb026.css
          test -f web/functions/cgweb026.js
          test -f web/public/cgweb027.js
          test -f web/public/cgweb027.css
          test -f web/public/cgweb028.js
          test -f web/public/cgweb028.css
          test -f web/functions/cgweb028.js
          test -f web/public/cgweb029.js
          test -f web/public/cgweb029.css
          test -f web/public/cgweb030.js
          test -f web/public/cgweb030.css
          test -f web/public/cgweb031.js
          test -f web/public/cgweb031.css
          test -f web/public/cgweb032.js
          test -f web/public/cgweb032.css
          test -f web/public/cgweb033.js
          test -f web/public/cgweb033.css
          test -f web/public/cgweb034.js
          test -f web/public/cgweb034.css
          test -f web/functions/cgweb030.js
          test -f web/functions/cgweb031.js
          test -f web/functions/cgweb032.js
          test -f web/functions/cgweb029.js
          test -f web/functions/cgweb025.js
          grep -Fq 'CGIMPORT002' web/public/index.html
          grep -Fq 'cgweb016fix2.js?v=' web/public/index.html
          grep -Fq 'cgweb016fix2.css?v=' web/public/index.html
          grep -Fq 'cgimport002Quizypedia' web/functions/index.js
          grep -Fq '"/api/quizypedia"' web/firebase.json
          grep -Fq 'cgimage001.js?v=CGIMAGE001_1' web/public/index.html
          grep -Fq 'cgimage009.css?v=CGIMAGE009_1' web/public/index.html
          grep -Fq 'cgimage005.js?v=CGIMAGE005_1' web/public/index.html
          grep -Fq 'cgimage006.js?v=CGIMAGE006_1' web/public/index.html
          grep -Fq 'cgimage007.js?v=CGIMAGE007_1' web/public/index.html
          grep -Fq 'cgimage008.js?v=CGIMAGE008_1' web/public/index.html
          grep -Fq 'cgimage002.js?v=CGIMAGE002_1' web/public/index.html
          grep -Fq 'cgweb017.js?v=CGWEB017_1' web/public/index.html
          grep -Fq 'cgweb018.js?v=CGWEB018_FIX5' web/public/index.html
          grep -Fq 'cgweb018.css?v=CGWEB018_FIX5' web/public/index.html
          grep -Fq 'cgweb019.js?v=CGWEB019_1' web/public/index.html
