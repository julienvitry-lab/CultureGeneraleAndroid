          node --check web/functions/cgweb024.js
          node --check web/public/cgweb025.js
          node --check web/functions/cgweb025.js
          node --check web/public/cgweb026.js
          node --check web/functions/cgweb026.js
          node --check web/public/cgweb027.js
          node --check web/public/cgweb028.js
          node --check web/functions/cgweb028.js
          node --check web/public/cgweb029.js
          node --check web/public/cgweb030.js
          node --check web/public/cgweb031.js
          node --check web/public/cgweb032.js
          node --check web/public/cgweb033.js
          node --check web/public/cgweb034.js
          node --check web/functions/cgweb030.js
          node --check web/functions/cgweb031.js
          node --check web/functions/cgweb032.js
          node --check web/functions/cgweb029.js
          node --check web/public/cgweb016fix2.js
          node --check web/public/app.js
          node --check web/functions/index.js
          echo "CGIMPORT002 + CGIMAGE001 : fichiers et syntaxe OK"

      - name: Authentification Google Cloud / Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CULTUREGENERALESYNC }}

      - name: Installer les dépendances Firebase Functions
        working-directory: web/functions
        run: npm install --omit=dev --no-audit --no-fund

      - name: Déployer Hosting + Function + règles Storage
        working-directory: web
        env:
          GOOGLE_CLOUD_PROJECT: culturegeneralesync
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.28.2 deploy \
            --only hosting,functions:cgimport002Quizypedia,functions:cgimage005MigrateBatch,functions:cgimage007RecoverFailed,functions:cgimage008SuggestCandidates,functions:cgimage008ApplyCandidate,functions:cgweb018ThemeContains,functions:cgweb020QualityScan,functions:cgweb021Bulk,functions:cgweb022History,functions:cgweb024ImportReview,functions:cgweb025Duplicates,functions:cgweb026ImageCenter,functions:cgweb028Analytics,functions:cgweb029Restore,functions:cgweb030Lists,functions:cgweb031Home,functions:cgweb032Search,storage \
            --project culturegeneralesync \
            --non-interactive \
            --force

      - name: Contrôler le site déployé
        shell: bash
        run: |
          set -euo pipefail

          ok=0

          for attempt in 1 2 3 4 5 6; do
            STAMP="$(date +%s)-${attempt}"

            echo "Contrôle Hosting tentative ${attempt}/6..."

            curl --fail --silent --show-error --location               --header 'Cache-Control: no-cache'               "https://culturegeneralesync.web.app/?cgdeploy=${STAMP}"               -o /tmp/cg-live.html || true

            if test -s /tmp/cg-live.html               && grep -Fq 'CGIMPORT002' /tmp/cg-live.html               && grep -Fq 'cgimage001.js?v=CGIMAGE001_1' /tmp/cg-live.html               && grep -Fq 'cgimage002.js?v=CGIMAGE002_1' /tmp/cg-live.html               && grep -Fq 'cgimage005.js?v=CGIMAGE005_1' /tmp/cg-live.html               && grep -Fq 'cgimage006.js?v=CGIMAGE006_1' /tmp/cg-live.html               && grep -Fq 'cgimage007.js?v=CGIMAGE007_1' /tmp/cg-live.html
            then
              if curl --fail --silent --show-error --location                 --header 'Cache-Control: no-cache'                 "https://culturegeneralesync.web.app/cgimage007.js?cgdeploy=${STAMP}"                 -o /tmp/cgimage007-live.js                 && grep -Fq 'CGIMAGE007_1' /tmp/cgimage007-live.js
              then
                ok=1
                break
              fi
            fi

            sleep 10
          done

          if [ "$ok" -ne 1 ]; then
            echo "❌ Hosting non propagé après 6 tentatives."
            echo "---- index reçu ----"
            head -80 /tmp/cg-live.html || true
            echo "---- cgimage007 reçu ----"
            head -40 /tmp/cgimage007-live.js || true
            exit 1
          fi

          echo "✅ CGIMPORT002 + CGIMAGE001/2/5/6/7 sont servis par culturegeneralesync.web.app"
