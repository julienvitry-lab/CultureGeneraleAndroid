name: Déployer Culture Générale Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/CGIMPORT002_WEB_DEPLOY.yml"

permissions:
  contents: read

concurrency:
  group: culturegeneralesync-web-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/functions/package.json

      - name: Vérifier les fichiers CGIMPORT002 Web
        shell: bash
        run: |
          set -euo pipefail
          test -f web/public/index.html
          test -f web/public/cgimport002.js
          test -f web/public/cgimport002.css
          test -f web/functions/index.js
          test -f web/functions/package.json
          test -f web/firebase.json
          test -f web/storage.rules
          test -f web/public/cgimage001.js
          test -f web/public/cgimage001.css
          test -f web/public/cgimage009.css
          test -f web/public/cgimage005.js
          test -f web/public/cgimage006.js
          test -f web/public/cgimage007.js
          test -f web/public/cgimage008.js
          test -f web/functions/cgimage008.js
          test -f web/functions/cgimage007.js
          test -f web/functions/cgimage005.js
          test -f web/public/cgimage002.js
          test -f web/public/cgimage002.css
          grep -Fq 'CGIMPORT002' web/public/index.html
          grep -Fq 'cgimport002Quizypedia' web/functions/index.js
          grep -Fq '"/api/quizypedia"' web/firebase.json
          grep -Fq 'cgimage001.js?v=CGIMAGE001_1' web/public/index.html
          grep -Fq 'cgimage009.css?v=CGIMAGE009_1' web/public/index.html
          grep -Fq 'cgimage005.js?v=CGIMAGE005_1' web/public/index.html
          grep -Fq 'cgimage006.js?v=CGIMAGE006_1' web/public/index.html
          grep -Fq 'cgimage007.js?v=CGIMAGE007_1' web/public/index.html
          grep -Fq 'cgimage008.js?v=CGIMAGE008_1' web/public/index.html
          grep -Fq 'cgimage002.js?v=CGIMAGE002_1' web/public/index.html
          grep -Fq 'question-images' web/storage.rules
          grep -Fq 'exports.cgimage005MigrateBatch' web/functions/index.js
          node --check web/public/cgimport002.js
          node --check web/public/cgimage001.js
          node --check web/public/cgimage005.js
          node --check web/public/cgimage006.js
          node --check web/public/cgimage007.js
          node --check web/public/cgimage008.js
          node --check web/functions/cgimage008.js
          node --check web/functions/cgimage007.js
          node --check web/functions/cgimage005.js
          node --check web/public/cgimage002.js
          node --check web/functions/index.js
          echo "CGIMPORT002 + CGIMAGE001 : fichiers et syntaxe OK"

      - name: Authentification Google Cloud / Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CULTUREGENERALESYNC }}

      - name: Installer les dépendances Firebase Functions
        working-directory: web/functions
        run: npm install --omit=dev --no-audit --no-fund

      - name: Déployer Hosting + Function + règles Storage
        working-directory: web
        env:
          GOOGLE_CLOUD_PROJECT: culturegeneralesync
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.28.2 deploy \
            --only hosting,functions:cgimport002Quizypedia,functions:cgimage005MigrateBatch,functions:cgimage007RecoverFailed,functions:cgimage008SuggestCandidates,functions:cgimage008ApplyCandidate,storage \
            --project culturegeneralesync \
            --non-interactive \
            --force

      - name: Contrôler le site déployé
        shell: bash
        run: |
          set -euo pipefail

          ok=0

          for attempt in 1 2 3 4 5 6; do
            STAMP="$(date +%s)-${attempt}"

            echo "Contrôle Hosting tentative ${attempt}/6..."

            curl --fail --silent --show-error --location               --header 'Cache-Control: no-cache'               "https://culturegeneralesync.web.app/?cgdeploy=${STAMP}"               -o /tmp/cg-live.html || true

            if test -s /tmp/cg-live.html               && grep -Fq 'CGIMPORT002' /tmp/cg-live.html               && grep -Fq 'cgimage001.js?v=CGIMAGE001_1' /tmp/cg-live.html               && grep -Fq 'cgimage002.js?v=CGIMAGE002_1' /tmp/cg-live.html               && grep -Fq 'cgimage005.js?v=CGIMAGE005_1' /tmp/cg-live.html               && grep -Fq 'cgimage006.js?v=CGIMAGE006_1' /tmp/cg-live.html               && grep -Fq 'cgimage007.js?v=CGIMAGE007_1' /tmp/cg-live.html
            then
              if curl --fail --silent --show-error --location                 --header 'Cache-Control: no-cache'                 "https://culturegeneralesync.web.app/cgimage007.js?cgdeploy=${STAMP}"                 -o /tmp/cgimage007-live.js                 && grep -Fq 'CGIMAGE007_1' /tmp/cgimage007-live.js
              then
                ok=1
                break
              fi
            fi

            sleep 10
          done

          if [ "$ok" -ne 1 ]; then
            echo "❌ Hosting non propagé après 6 tentatives."
            echo "---- index reçu ----"
            head -80 /tmp/cg-live.html || true
            echo "---- cgimage007 reçu ----"
            head -40 /tmp/cgimage007-live.js || true
            exit 1
          fi

          echo "✅ CGIMPORT002 + CGIMAGE001/2/5/6/7 sont servis par culturegeneralesync.web.app"
