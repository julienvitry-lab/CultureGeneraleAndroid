name: Installer CGWEB035 LEARNING_HUB001

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    name: Installer LEARNING_HUB001
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer CGWEB035
        shell: bash
        run: |
          set -euo pipefail
          
          REPO="$GITHUB_WORKSPACE"
          PUB="$REPO/web/public"
          FUN="$REPO/web/functions"
          INDEX="$PUB/index.html"
          NAV="$PUB/cgweb016fix2.js"
          FUN_INDEX="$FUN/index.js"
          WF="$REPO/.github/workflows/CGIMPORT002_WEB_DEPLOY.yml"
          JS="$PUB/cgweb035.js"
          CSS="$PUB/cgweb035.css"
          BACK="$FUN/cgweb035.js"
          README="$REPO/README_CGWEB035_LEARNING_HUB001.txt"
          PATCH="$RUNNER_TEMP/.cgweb035_learning_patch.py"
          
          
          echo "============================================================"
          echo " CGWEB035 · LEARNING_HUB001"
          echo "============================================================"
          echo "Transfert Web des fonctions HISTORIQUE / APPRENTISSAGE."
          echo "Android n'est pas modifié par ce lot."
          echo
          
          cd "$REPO"
          
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ Dépôt non propre. Aucune modification effectuée."
            git status --short
            exit 20
          fi
          
          
          for f in "$INDEX" "$NAV" "$FUN_INDEX" "$WF" "$PUB/cgweb034.js"; do
            test -f "$f" || { echo "❌ Fichier requis absent : $f"; exit 21; }
          done
          
          grep -Fq 'data-cg16-page="home2"' "$NAV" || { echo "❌ Navigation CGWEB030+ absente."; exit 22; }
          grep -Fq 'functions:cgweb032Search' "$WF" || { echo "❌ Déploiement CGWEB032 absent."; exit 23; }
          grep -Fq 'window.CGWEB001' "$PUB/app.js" || { echo "❌ Auth/API CGWEB001 absente."; exit 24; }
          
          echo "✅ Baseline Web reconnue."
          
          echo
          echo "=== 1. Création backend / frontend ==="
          
          python - "$BACK" "$JS" "$CSS" <<'PY'
          from pathlib import Path
          import base64,sys
          vals=["","",""]
          for p,b in zip(sys.argv[1:],vals):
              Path(p).write_text(base64.b64decode(b).decode("utf-8"),encoding="utf-8")
          print("✅ cgweb035 backend + JS + CSS créés")
          PY
          
          echo
          echo "=== 2. Navigation / index / Functions / workflow ==="
          
          python - "$PATCH" <<'PY'
          from pathlib import Path
          import base64,sys
          Path(sys.argv[1]).write_text(base64.b64decode("").decode("utf-8"),encoding="utf-8")
          PY
          
          python "$PATCH" "$NAV" "$INDEX" "$FUN_INDEX" "$WF"
          rm -f "$PATCH"
          
          cat > "$README" <<'EOF'
          CGWEB035 · LEARNING_HUB001
          
          Objectif
          - déplacer l'interface HISTORIQUE / APPRENTISSAGE vers CULTURE GÉNÉRALE WEB ;
          - Android reste source de PLAYLOG mais n'est pas modifié dans ce lot.
          
          Page Web « Apprentissage »
          - Vue d'ensemble
          - Historique : Tous / QCM / Mental / Révision + tentatives + temps
          - Maîtrise : Découverte / Fragile / Connue / Maîtrisée / À réviser
          - Jamais vues : compteurs domaine / thème + liste d'IDs
          - À réviser : 1 / 3 / 7 / 30 / 60 jours
          - Points faibles : 45 % erreurs globales + 30 % récent + 15 % erreurs répétées + 10 % lenteur
          - Temps de réponse : médiane / moyenne / connue mais lente
          - Difficulté : 80 % erreurs ajustées + 20 % lenteur + confiance par échantillon
          
          Architecture
          - users/<uid>/play_history : source des événements
          - users/<uid>/questions : catalogue pour Jamais vues
          - backend cgweb035LearningHub authentifié
          - analyses en lecture seule
          - aucune modification Android
          EOF
          
          echo
          echo "=== 3. Contrôles statiques ==="
          
          node --check "$BACK"
          node --check "$JS"
          node --check "$NAV"
          node --check "$FUN_INDEX"
          
          grep -Fq "CGWEB035_LEARNING_HUB001" "$JS"
          grep -Fq "exports.cgweb035LearningHub" "$BACK"
          grep -Fq 'data-cg16-page="learning"' "$NAV"
          grep -Fq 'data-cg16-page-panel="learning"' "$NAV"
          grep -Fq 'move("cgweb035Panel", "cg16LearningMount")' "$NAV"
          grep -Fq 'cgweb035.js?v=CGWEB035_LEARNING_HUB001' "$INDEX"
          grep -Fq 'exports.cgweb035LearningHub' "$FUN_INDEX"
          grep -Fq 'functions:cgweb035LearningHub' "$WF"
          grep -Fq 'node --check web/functions/cgweb035.js' "$WF"
          
          if grep -Fq "SQLite" "$BACK" "$JS"; then
            echo "❌ Référence SQLite détectée dans CGWEB035."
            exit 30
          fi
          
          if grep -Eq 'await .*\.(set|update|delete)\(' "$BACK"; then
            echo "❌ Écriture Firestore détectée dans le moteur analytique."
            exit 31
          fi
          
          git diff --check
          
          echo "✅ Historique Web"
          echo "✅ Maîtrise Web"
          echo "✅ Jamais vues Web"
          echo "✅ Révision espacée Web"
          echo "✅ Points faibles Web"
          echo "✅ Temps de réponse Web"
          echo "✅ Difficulté Web"
          echo "✅ Backend analytique en lecture seule"
          
          echo
          echo "=== 4. Résumé ==="
          git --no-pager diff --stat
          
          echo
          echo "=== 5. Commit + push ==="
          
          git add "$BACK" "$JS" "$CSS" "$INDEX" "$NAV" "$FUN_INDEX" "$WF" "$README"
          
          if git diff --cached --quiet; then
            echo "ℹ️ Aucun changement à committer : CGWEB035 semble déjà installé."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "CGWEB035 LEARNING_HUB001 transfer learning analytics to web"
            git push origin HEAD:main
          fi
          
          echo
          echo "============================================================"
          echo "✅ CGWEB035 · LEARNING_HUB001 envoyé sur GitHub."
          echo "============================================================"
          echo "Après Actions Web vertes :"
          echo "1. ouvre https://culturegeneralesync.web.app ;"
          echo "2. ouvre l'onglet Apprentissage ;"
          echo "3. vérifie les 8 vues ;"
          echo "4. teste Historique puis Maîtrise puis Jamais vues ;"
          echo "5. ouvre un domaine/thème dans Points faibles et Difficulté."
          echo
          echo "IMPORTANT : aucun écran Android n'est supprimé ici."
          echo "Le nettoyage Android viendra seulement après validation du Web."
          echo
          git --no-pager log -1 --oneline
          echo
