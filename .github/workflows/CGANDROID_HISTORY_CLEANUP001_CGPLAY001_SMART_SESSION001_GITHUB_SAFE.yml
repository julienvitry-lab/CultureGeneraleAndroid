name: Installer HISTORY_CLEANUP001 + SMART_SESSION001

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    name: Nettoyer Android et ajouter Session intelligente Web
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer les deux lots
        shell: bash
        run: |
          set -euo pipefail

          REPO="$GITHUB_WORKSPACE"
          MAIN="$REPO/app/src/main/java/fr/culturegenerale/android/MainActivity.java"
          JAVA_DIR="$REPO/app/src/main/java/fr/culturegenerale/android"

          WEB_HELPER="$REPO/web/functions/cgweb035.js"
          WEB_FRONT="$REPO/web/public/cgweb035.js"
          WEB_CSS="$REPO/web/public/cgweb035.css"
          WEB_INDEX="$REPO/web/public/index.html"

          PATCH="$RUNNER_TEMP/history_cleanup001.py"
          README="$REPO/README_CGANDROID_HISTORY_CLEANUP001_CGPLAY001_SMART_SESSION001.txt"

          cd "$REPO"

          echo "============================================================"
          echo " CGANDROID · HISTORY_CLEANUP001"
          echo " CGPLAY001 · SMART_SESSION001"
          echo "============================================================"
          echo

          test -f "$MAIN"
          test -f "$JAVA_DIR/CgHistory001B.java"
          test -f "$WEB_HELPER"
          test -f "$WEB_FRONT"
          test -f "$WEB_CSS"
          test -f "$WEB_INDEX"

          grep -Fq 'collection("play_history")' "$JAVA_DIR/CgHistory001B.java"
          grep -Fq 'cgHistory001bLogChoice(answeredQuestion, choice);' "$MAIN"
          grep -Fq 'cgHistory001bLogMental(answeredQuestion, status);' "$MAIN"
          grep -Fq 'SQLiteDatabase.ENABLE_WRITE_AHEAD_LOGGING' "$MAIN"

          echo "✅ PLAYLOG_SAFE et sécurité SQLite détectés."

          echo
          echo "=== 1. HISTORY_CLEANUP001 Android ==="

          python - "$PATCH" <<'PY'
          from pathlib import Path
          import base64,sys
          Path(sys.argv[1]).write_text(base64.b64decode("").decode("utf-8"),encoding="utf-8")
          PY

          python "$PATCH" "$MAIN"
          rm -f "$PATCH"

          rm -f   "$JAVA_DIR/CgPlayHistoryUi001.java"   "$JAVA_DIR/CgMastery001.java"   "$JAVA_DIR/CgWeakness001.java"   "$JAVA_DIR/CgResponseTime001.java"   "$JAVA_DIR/CgQuestionDifficulty001.java"

          echo "✅ écrans analytiques Android retirés."

          for token in CgPlayHistoryUi001 CgMastery001 CgWeakness001 CgResponseTime001 CgQuestionDifficulty001; do
            if grep -R -Fq "$token" "$JAVA_DIR" --include='*.java'; then
              echo "❌ référence Java restante vers $token"
              grep -R -Fn "$token" "$JAVA_DIR" --include='*.java' || true
              exit 31
            fi
          done

          if grep -Fq 'Button playHistory = btn(' "$MAIN"    || grep -Fq 'Button neverSeen = btn(' "$MAIN"    || grep -Fq 'Button spacedReview = btn(' "$MAIN"; then
            echo "❌ un ancien bouton Apprentissage reste visible sur Android."
            exit 32
          fi

          PHYSICAL_OPEN_COUNT="$(grep -c 'SQLiteDatabase.openDatabase(' "$MAIN" || true)"
          if [ "$PHYSICAL_OPEN_COUNT" -ne 1 ]; then
            echo "❌ Régression SQLite : $PHYSICAL_OPEN_COUNT ouvertures physiques."
            exit 33
          fi

          grep -Fq 'class CgHistory001B' "$JAVA_DIR/CgHistory001B.java"
          grep -Fq 'collection("play_history")' "$JAVA_DIR/CgHistory001B.java"
          grep -Fq 'cgHistory001bLogChoice(answeredQuestion, choice);' "$MAIN"
          grep -Fq 'cgHistory001bLogMental(answeredQuestion, status);' "$MAIN"

          echo "✅ Android = jeu + PLAYLOG ; historique analytique non exposé."

          echo
          echo "=== 2. SMART_SESSION001 Web ==="

          CURRENT_HELPER_SHA="$(sha256sum "$WEB_HELPER" | awk '{print $1}')"
          CURRENT_FRONT_SHA="$(sha256sum "$WEB_FRONT" | awk '{print $1}')"
          CURRENT_CSS_SHA="$(sha256sum "$WEB_CSS" | awk '{print $1}')"

          if [ "$CURRENT_HELPER_SHA" != "1b107a43a8a8885b7f46cdd01d26063bd445b643711ba0463c53f1c0523b4579" ]; then
            echo "❌ cgweb035 backend a changé depuis FIX1 ; arrêt pour ne rien écraser."
            echo "Attendu : 1b107a43a8a8885b7f46cdd01d26063bd445b643711ba0463c53f1c0523b4579"
            echo "Actuel  : $CURRENT_HELPER_SHA"
            exit 40
          fi

          if [ "$CURRENT_FRONT_SHA" != "05aec1b8200e2c6370b574a28712b8f4ba562e371485e072b6ed7c0427526830" ]; then
            echo "❌ cgweb035 frontend a changé depuis FIX1 ; arrêt pour ne rien écraser."
            echo "Attendu : 05aec1b8200e2c6370b574a28712b8f4ba562e371485e072b6ed7c0427526830"
            echo "Actuel  : $CURRENT_FRONT_SHA"
            exit 41
          fi

          if [ "$CURRENT_CSS_SHA" != "f368a2504e08ec2cf09a3dd8881876c62bad37c4468f8cac6145a19ea83b30df" ]; then
            echo "❌ cgweb035 CSS a changé depuis FIX1 ; arrêt pour ne rien écraser."
            echo "Attendu : f368a2504e08ec2cf09a3dd8881876c62bad37c4468f8cac6145a19ea83b30df"
            echo "Actuel  : $CURRENT_CSS_SHA"
            exit 42
          fi

          python - "$WEB_HELPER" "$WEB_FRONT" "$WEB_CSS" <<'PY'
          from pathlib import Path
          import base64,sys
          vals=["","",""]
          for path,b64 in zip(sys.argv[1:],vals):
              Path(path).write_text(base64.b64decode(b64).decode("utf-8"),encoding="utf-8")
          print("✅ SMART_SESSION001 installé")
          PY

          python - "$WEB_INDEX" <<'PY'
          from pathlib import Path
          import sys,re
          p=Path(sys.argv[1])
          s=p.read_text(encoding="utf-8")
          s=re.sub(
              r'(cgweb035\.js\?v=)[^"]+',
              r'\1CGPLAY001_SMART_SESSION001',
              s,
              count=1
          )
          s=re.sub(
              r'(cgweb035\.css\?v=)[^"]+',
              r'\1CGPLAY001_SMART_SESSION001',
              s,
              count=1
          )
          p.write_text(s,encoding="utf-8")
          PY

          node --check "$WEB_HELPER"
          node --check "$WEB_FRONT"

          grep -Fq "mode==='smartSession'" "$WEB_HELPER"
          grep -Fq 'data-cg35-tab="smart"' "$WEB_FRONT"
          grep -Fq 'Générer la séance' "$WEB_FRONT"
          grep -Fq 'CGPLAY001_SMART_SESSION001' "$WEB_INDEX"

          echo "✅ Session intelligente Web : 5–50 questions."
          echo "✅ Mix configurable : À réviser / Points faibles / Jamais vues."
          echo "✅ Filtre par domaine."
          echo "✅ Déduplication automatique."
          echo "✅ Complément par Jamais vues quand les stocks prioritaires sont insuffisants."

          echo
          echo "=== 3. Contrôle Android ==="
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

          echo
          echo "=== 4. Garde-fous finaux ==="
          git diff --check

          if ! git diff --quiet -- .github/workflows; then
            echo "❌ Un workflow GitHub a été modifié : arrêt."
            git diff -- .github/workflows
            exit 50
          fi

          cat > "$README" <<'EOF'
          CGANDROID · HISTORY_CLEANUP001
          - suppression de l'accueil Android : HISTORIQUE / JAMAIS VUES / À RÉVISER ;
          - suppression des classes analytiques Android Historique / Maîtrise / Points faibles / Temps / Difficulté ;
          - PLAYLOG_SAFE est conservé ;
          - une seule ouverture physique SQLite + WAL conservés ;
          - les anciens moteurs de jeu Jamais vues / Révision espacée restent dormants dans MainActivity pour limiter le risque de régression : ils ne sont plus exposés dans l'interface.

          CGPLAY001 · SMART_SESSION001
          - nouvel onglet « Session intelligente » dans Web > Apprentissage ;
          - taille 5 à 50 questions ;
          - dosage configurable À réviser / Points faibles / Jamais vues ;
          - filtre optionnel par domaine ;
          - aucune duplication d'une question dans une session ;
          - priorité aux révisions échues et points faibles disponibles ;
          - complément automatique par questions jamais vues ;
          - aucune écriture analytique Firestore.
          EOF

          echo "✅ Aucun workflow modifié."
          echo
          git --no-pager diff --stat

          echo
          echo "=== 5. Commit + push ==="
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add   "$MAIN"   "$JAVA_DIR"   "$WEB_HELPER"   "$WEB_FRONT"   "$WEB_CSS"   "$WEB_INDEX"   "$README"

          if git diff --cached --quiet; then
            echo "ℹ️ Les deux lots sont déjà appliqués."
          else
            git commit -m "CGANDROID HISTORY_CLEANUP001 and CGPLAY001 SMART_SESSION001"
            git push origin HEAD:main
          fi

          echo
          echo "============================================================"
          echo "✅ HISTORY_CLEANUP001 + SMART_SESSION001 POUSSÉS SUR MAIN"
          echo "============================================================"
          echo "À lancer ensuite manuellement dans Actions :"
          echo "  1. Déployer Culture Générale Web"
          echo "  2. Construire CultureGenerale Android signé"
          echo

