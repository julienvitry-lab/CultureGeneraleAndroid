name: CGANDROID013 · CultureGenerale Tablette

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tablet/**"
      - "settings.gradle"
      - "build.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/CGANDROID013_TABLET.yml"

permissions:
  contents: read

jobs:
  build-tablet:
    name: Construire uniquement l'APK tablette
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Conserver la même clé debug entre les builds tablette
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cgandroid-tablet-debug-keystore-v1

      - name: Préparer Gradle
        run: chmod +x gradlew

      - name: Vérifier que seul le module tablet est ciblé
        run: |
          set -euo pipefail
          test -f tablet/build.gradle
          test -f tablet/src/main/AndroidManifest.xml
          grep -Fq "applicationId 'fr.culturegenerale.android.tablet'" tablet/build.gradle
          echo "✓ module ciblé : tablet"
          echo "✓ applicationId : fr.culturegenerale.android.tablet"

      - name: Compiler CGANDROID013 pour tablette
        run: ./gradlew :tablet:assembleDebug --stacktrace --no-daemon

      - name: Vérifier l'APK produit
        run: |
          set -euo pipefail
          APK="tablet/build/outputs/apk/debug/tablet-debug.apk"
          test -s "$APK"
          echo "APK : $APK"
          ls -lh "$APK"

      - name: Publier l'APK tablette CGANDROID013
        uses: actions/upload-artifact@v4
        with:
          name: CultureGenerale-Tablette-CGANDROID013
          path: tablet/build/outputs/apk/debug/tablet-debug.apk
          if-no-files-found: error
          retention-days: 14
