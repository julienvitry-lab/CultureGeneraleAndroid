plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def ciKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def ciKeystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def ciKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def ciKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')

def hasPermanentSigning =
        ciKeystorePath != null && !ciKeystorePath.trim().isEmpty() &&
        ciKeystorePassword != null && !ciKeystorePassword.trim().isEmpty() &&
        ciKeyAlias != null && !ciKeyAlias.trim().isEmpty() &&
        ciKeyPassword != null && !ciKeyPassword.trim().isEmpty()

android {
    namespace 'fr.culturegenerale.android'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.culturegenerale.android'
        minSdk 23
        targetSdk 35
        versionCode 949
        versionName '9.4.9-synccloud001-live-fix3'
    }

    signingConfigs {
        permanent {
            if (hasPermanentSigning) {
                storeFile file(ciKeystorePath)
                storePassword ciKeystorePassword
                keyAlias ciKeyAlias
                keyPassword ciKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (hasPermanentSigning) {
                signingConfig signingConfigs.permanent
            }
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.16.0')
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-auth'
}
